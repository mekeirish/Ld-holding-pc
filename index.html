    body { margin: 0; padding: 0; background-color: #0E1B2D; font-family: system-ui; min-height: 100vh; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0E1B2D; }
    ::-webkit-scrollbar-thumb { background: #3A4A5F; border-radius: 4px; }

    input, select, textarea { background-color: #1E2F44; color: #F0F4F8; border-color: #3A4A5F; }
    input:focus, select:focus, textarea:focus { border-color: #E8F04F; outline: none; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    .modal-overlay { animation: fadeIn 0.2s ease-out; }
    .modal-content { animation: scaleIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .skeleton-pulse { animation: skeleton 1.5s ease-in-out infinite; }
    @keyframes skeleton { 0%,100% { opacity: 0.4; } 50% { opacity: 0.8; } }

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB6uTZ4iCqNMzL-GeZq6tDgoI_sJj-ZMuo",

  <script>
    const THEME = {
      colors: {
        background: '#0E1B2D', primary: '#E8F04F', secondary: '#3DC59D',
        text: '#F0F4F8', textMuted: '#9CA3AF', border: '#3A4A5F',
        cardBg: '#1A2A3F', inputBg: '#1E2F44', danger: '#EF4444', success: '#3DC59D',
      },
    };

    const DICT = Object.freeze({
      VIEW: { DASHBOARD: 'VIEW_DASHBOARD', DETAIL: 'VIEW_DETAIL' },
      UI: { BTN_CANCEL: 'Annuler', BTN_CONFIRM: 'Confirmer' }
    });

    const { useState, useEffect, useRef } = React;

    // ===== Composant Button =====
    const Button = ({ onClick, children, variant = 'primary', className = '', disabled = false, size = 'md' }) => {
      const sizes = { sm: 'py-2 px-4 text-sm', md: 'py-3 px-6', lg: 'py-4 px-8 text-lg' };
      const base = `font-medium rounded-xl transition-all duration-200 active:scale-[0.98] ${sizes[size]}`;
      const variants = {
        primary: `bg-[${THEME.colors.primary}] text-[${THEME.colors.background}] hover:brightness-110`,
        secondary: `border-2 border-[${THEME.colors.primary}] text-[${THEME.colors.primary}] hover:bg-[${THEME.colors.primary}] hover:text-[${THEME.colors.background}]`,
        danger: `bg-rose-500 text-white hover:bg-rose-600`,
        ghost: `text-[${THEME.colors.textMuted}] hover:bg-[${THEME.colors.inputBg}] hover:text-[${THEME.colors.text}]`
      };
      const disabledClass = disabled ? "opacity-50 cursor-not-allowed pointer-events-none" : "";
      return React.createElement("button", { onClick, disabled, className: `${base} ${variants[variant]} ${className} ${disabledClass}` }, children);
    };

    // ===== Modal =====
    const Modal = ({ isOpen, onClose, title, children, size = 'md' }) => {
      if (!isOpen) return null;
      const sizes = { sm: 'max-w-sm', md: 'max-w-lg', lg: 'max-w-2xl', xl: 'max-w-4xl' };
      return React.createElement("div", {
        className: "fixed inset-0 flex items-center justify-center p-4 z-50 modal-overlay bg-black/60 backdrop-blur-sm",
        onClick: onClose
      }, React.createElement("div", {
        className: `modal-content w-full ${sizes[size]} p-6 rounded-2xl max-h-[90vh] overflow-y-auto border border-[${THEME.colors.border}] shadow-2xl bg-[${THEME.colors.cardBg}]`,
        onClick: e => e.stopPropagation()
      },
        React.createElement("div", { className: "flex justify-between items-center mb-5 gap-2" },
          React.createElement("h2", { className: `text-[${THEME.colors.primary}] font-semibold text-xl` }, title),
          onClose && React.createElement("button", {
            onClick: onClose,
            className: `text-[${THEME.colors.textMuted}] hover:text-[${THEME.colors.text}] w-8 h-8 flex items-center justify-center rounded-full hover:bg-[${THEME.colors.inputBg}] transition-colors flex-shrink-0`,
            "aria-label": "Fermer"
          }, "✕")
        ),
        children
      ));
    };

    // ===== ImageUpload =====
    const ImageUpload = ({ onUpload, currentImage }) => {
      const handleChange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = event => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const size = 300;
            canvas.width = canvas.height = size;
            const ctx = canvas.getContext("2d");
            const ratio = Math.max(size / img.width, size / img.height);
            const w = img.width * ratio, h = img.height * ratio;
            ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
            onUpload(canvas.toDataURL("image/jpeg", 0.9));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      };
      return React.createElement("div", { className: "flex items-center gap-3" },
        currentImage && React.createElement("div", { className: "w-16 h-16 rounded-lg overflow-hidden bg-[#0E1B2D] border border-[#3A4A5F] flex-shrink-0" },
          React.createElement("img", { src: currentImage, className: "w-full h-full object-cover" })
        ),
        React.createElement("input", {
          type: "file", onChange: handleChange,
          className: `flex-1 text-sm text-[${THEME.colors.textMuted}] file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-[${THEME.colors.primary}] file:text-[${THEME.colors.background}] hover:file:brightness-110 cursor-pointer`
        })
      );
    };

    // ===== Cartes publiques =====
    const BrandCard = ({ brand, onClick }) =>
      React.createElement("button", { onClick, className: `group flex flex-col rounded-2xl overflow-hidden bg-[${THEME.colors.cardBg}] border border-[${THEME.colors.border}] transition-all hover:border-[${THEME.colors.primary}] hover:shadow-2xl hover:-translate-y-1 text-left` },
        React.createElement("div", { className: `w-full aspect-square overflow-hidden bg-[${THEME.colors.inputBg}]` },
          brand.image ? React.createElement("img", { src: brand.image, className: "w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" })
          : React.createElement("div", { className: "w-full h-full flex items-center justify-center" },
              React.createElement("span", { className: `text-[${THEME.colors.textMuted}] text-sm` }, "IMAGE")
            )
        ),
        React.createElement("div", { className: "p-4" },
          React.createElement("h3", { className: `text-[${THEME.colors.text}] font-semibold text-base truncate` }, brand.name),
          React.createElement("p", { className: `text-[${THEME.colors.textMuted}] text-xs mt-1` }, (brand.products || []).length, " produit(s)")
        )
      );

    const ProductCard = ({ product, onClick, showPrices }) =>
      React.createElement("button", { onClick, className: `group flex flex-col rounded-2xl overflow-hidden bg-[${THEME.colors.cardBg}] border border-[${THEME.colors.border}] transition-all hover:border-[${THEME.colors.primary}] hover:shadow-2xl hover:-translate-y-1 text-left` },
        React.createElement("div", { className: `w-full aspect-square overflow-hidden bg-[${THEME.colors.inputBg}]` },
          product.image ? React.createElement("img", { src: product.image, className: "w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" })
          : React.createElement("div", { className: "w-full h-full flex items-center justify-center" },
              React.createElement("span", { className: `text-[${THEME.colors.textMuted}] text-sm` }, "PROD")
            )
        ),
        React.createElement("div", { className: "p-4" },
          React.createElement("h3", { className: `text-[${THEME.colors.text}] font-semibold text-sm truncate` }, product.name),
          React.createElement("p", { className: `text-[${THEME.colors.textMuted}] text-xs mt-1` }, "Pack: ", product.qty, " unités"),
          showPrices && React.createElement("p", { className: `text-[${THEME.colors.secondary}] text-sm font-semibold mt-2` }, Number(product.price).toLocaleString(), " DZD")
        )
      );

    // ===== Toast =====
    const Toast = ({ message, type, onClose }) => {
      if (!message) return null;
      const accentColors = { success: 'border-[#3DC59D]', error: 'border-rose-500', info: 'border-[#E8F04F]' };
      const icons = { success: '✓', error: '✕', info: 'ℹ' };
      const textColors = { success: 'text-[#3DC59D]', error: 'text-rose-400', info: 'text-[#E8F04F]' };
      return React.createElement("div", {
        className: `fixed bottom-24 md:bottom-6 left-1/2 -translate-x-1/2 z-[100] max-w-md w-full mx-4 p-4 rounded-xl bg-[#0E1B2D]/95 backdrop-blur-xl border border-white/5 shadow-2xl ${accentColors[type] || 'border-white/5'} border-l-4 animate-slide-up`
      }, React.createElement("div", { className: "flex items-center gap-3" },
        React.createElement("span", { className: `text-base font-bold ${textColors[type] || 'text-white'}` }, icons[type] || 'ℹ'),
        React.createElement("div", { className: "flex-1 text-sm text-white/90" }, message),
        React.createElement("button", { onClick: onClose, className: "text-white/30 hover:text-white/70 transition-colors" }, "✕")
      ));
    };

    // ===== Hash PIN =====
    const hashPin = async (pin) => {
      const encoder = new TextEncoder();
      const data = encoder.encode(pin);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    };

    // ===== Application =====
    const App = () => {
      // --- États existants (inchangés) ---
      const [isAdmin, setIsAdmin] = useState(false);
      const [adminSection, setAdminSection] = useState('home');
      const [showPinModal, setShowPinModal] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [pinConfirm, setPinConfirm] = useState('');
      const [pinMode, setPinMode] = useState('verify');
      const [pinError, setPinError] = useState('');
      const [adminList, setAdminList] = useState([]);
      const [showManageAdmins, setShowManageAdmins] = useState(false);
      const [newAdminName, setNewAdminName] = useState('');
      const [showDeleteConfirmModal, setShowDeleteConfirmModal] = useState(false);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [deleteCode, setDeleteCode] = useState('');

      const [logoUrl, setLogoUrl] = useState(() => localStorage.getItem('app_logo') || null);
      const [appTitle, setAppTitle] = useState(() => localStorage.getItem('app_title') || 'MARKET HUB');
      const [brands, setBrands] = useState([]);
      const [orders, setOrders] = useState([]);
      const [loading, setLoading] = useState(true);
      const [logoUrlInput, setLogoUrlInput] = useState('');
      const [clientInfo, setClientInfo] = useState({ nom: '', adresse: '', telephone: '', commentaire: '' });
      const [titleInput, setTitleInput] = useState('');
      const [statsPeriod, setStatsPeriod] = useState(8);
      const [showAllClients, setShowAllClients] = useState(false);

      const fileInputRef = useRef(null);
      const imageInputRef = useRef(null);
      const logoInputRef = useRef(null);
      const backupInputRef = useRef(null);
      const longPressTimerRef = useRef(null);
      const longPressTriggeredRef = useRef(false);

      // --- Nouveaux états admin (améliorations) ---
      // Commandes
      const [ordersSearch, setOrdersSearch] = useState('');
      const [ordersSort, setOrdersSort] = useState('date_desc');
      const [ordersPeriod, setOrdersPeriod] = useState('all');
      const [selectedOrders, setSelectedOrders] = useState([]);
      const [confirmCancelOrderId, setConfirmCancelOrderId] = useState(null);
      // Produits
      const [productsGlobalSearch, setProductsGlobalSearch] = useState('');
      const [productsSort, setProductsSort] = useState('name_asc');
      const [productsQuickFilter, setProductsQuickFilter] = useState('all');
      const [selectedProducts, setSelectedProducts] = useState([]);
      const [inlinePriceEdit, setInlinePriceEdit] = useState(null);
      const [inlinePriceSaving, setInlinePriceSaving] = useState(false);
      // Clients
      const [clientsSearch, setClientsSearch] = useState('');
      const [expandedClientKey, setExpandedClientKey] = useState(null);
      // Sauvegarde / backup
      const [showBackupImportConfirm, setShowBackupImportConfirm] = useState(false);
      const [pendingBackupData, setPendingBackupData] = useState(null);
      // Journal d'activité
      const [activityLog, setActivityLog] = useState([]);
      // Navigation mobile
      const [mobileNavOpen, setMobileNavOpen] = useState(false);
      // Squelettes de chargement (par section)
      const [ordersRefreshing, setOrdersRefreshing] = useState(false);

      // --- Effets de synchronisation Firebase (existants) ---
      useEffect(() => {
        try {
          const settingsRef = firebase.database().ref('settings');
          const settingsListener = settingsRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
              if (data.logo) setLogoUrl(data.logo);
              if (data.title) setAppTitle(data.title);
            }
            setLoading(false);
          });
          return () => settingsRef.off('value', settingsListener);
        } catch (err) {
          console.error('Erreur listener settings:', err);
          setLoading(false);
        }
      }, []);

      useEffect(() => {
        try {
          const brandsRef = firebase.database().ref('brands');
          const brandsListener = brandsRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
              const brandsArray = Object.keys(data).map(key => ({ id: key, ...data[key] }));
              setBrands(brandsArray);
            } else setBrands([]);
          });
          return () => brandsRef.off('value', brandsListener);
        } catch (err) { console.error('Erreur listener brands:', err); }
      }, []);

      useEffect(() => {
        try {
          const ordersRef = firebase.database().ref('orders');
          const ordersListener = ordersRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
              const ordersArray = Object.keys(data).map(key => {
                const order = data[key];
                return {
                  ...order, id: key,
                  items: Array.isArray(order.items) ? order.items : [],
                  status: order.status || 'received',
                  client: order.client || { nom: '', adresse: '', telephone: '', commentaire: '' }
                };
              });
              setOrders(ordersArray);
            } else setOrders([]);
          });
          return () => ordersRef.off('value', ordersListener);
        } catch (err) { console.error('Erreur listener orders:', err); }
      }, []);

      // --- Listener journal d'activité (NOUVEAU) ---
      useEffect(() => {
        try {
          const ref = firebase.database().ref('activity');
          const listener = ref.orderByChild('timestamp').limitToLast(100).on('value', (snapshot) => {
            const data = snapshot.val() || {};
            const arr = Object.keys(data).map(k => ({ id: k, ...data[k] }))
              .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            setActivityLog(arr);
          });
          return () => ref.off('value', listener);
        } catch (err) { console.error('activity listener:', err); }
      }, []);

      useEffect(() => { if (logoUrl) localStorage.setItem('app_logo', logoUrl); else localStorage.removeItem('app_logo'); }, [logoUrl]);
      useEffect(() => { localStorage.setItem('app_title', appTitle); }, [appTitle]);
      useEffect(() => { setTitleInput(appTitle); }, [appTitle]);

      const [showPrices, setShowPrices] = useState(() => {
        const saved = localStorage.getItem('show_prices');
        return saved !== null ? JSON.parse(saved) : true;
      });
      useEffect(() => { localStorage.setItem('show_prices', JSON.stringify(showPrices)); }, [showPrices]);

      const [currentView, setCurrentView] = useState(DICT.VIEW.DASHBOARD);
      const [selectedBrand, setSelectedBrand] = useState(null);

      const [toast, setToast] = useState({ message: '', type: 'info', visible: false });
      const toastTimeout = useRef(null);
      const showToast = (message, type = 'info') => {
        if (toastTimeout.current) clearTimeout(toastTimeout.current);
        setToast({ message, type, visible: true });
        toastTimeout.current = setTimeout(() => setToast({ message: '', type: 'info', visible: false }), 4000);
      };
      const hideToast = () => {
        if (toastTimeout.current) clearTimeout(toastTimeout.current);
        setToast({ message: '', type: 'info', visible: false });
      };

      const [modals, setModals] = useState({
        brand: false, product: false, brandSelect: false,
        productDetail: false, cart: false
      });
      const [editingProduct, setEditingProduct] = useState(null);
      const [selectedBrandForData, setSelectedBrandForData] = useState('');
      const [editingBrandId, setEditingBrandId] = useState(null);
      const [editingBrandName, setEditingBrandName] = useState('');
      const [editingBrandImage, setEditingBrandImage] = useState(null);
      const [confirmDeleteBrandId, setConfirmDeleteBrandId] = useState(null);
      const [confirmDeleteProduct, setConfirmDeleteProduct] = useState(null);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [productQuantity, setProductQuantity] = useState(1);
      const [productQuantityInput, setProductQuantityInput] = useState('1');
      const [orderTab, setOrderTab] = useState('received');
      const [expandedOrderId, setExpandedOrderId] = useState(null);

      const [cart, setCart] = useState(() => {
        const saved = localStorage.getItem('cart');
        return saved ? JSON.parse(saved) : [];
      });
      useEffect(() => localStorage.setItem('cart', JSON.stringify(cart)), [cart]);

      const [imgbbApiKey, setImgbbApiKey] = useState(() => localStorage.getItem('imgbb_api_key') || '');
      useEffect(() => localStorage.setItem('imgbb_api_key', imgbbApiKey), [imgbbApiKey]);

      const [imageProvider, setImageProvider] = useState(() => localStorage.getItem('image_provider') || 'cloudinary');
      useEffect(() => localStorage.setItem('image_provider', imageProvider), [imageProvider]);

      const [cloudinaryCloudName, setCloudinaryCloudName] = useState(() => localStorage.getItem('cloudinary_cloud_name') || 'h91be5lz');
      useEffect(() => localStorage.setItem('cloudinary_cloud_name', cloudinaryCloudName), [cloudinaryCloudName]);

      const [cloudinaryUploadPreset, setCloudinaryUploadPreset] = useState(() => localStorage.getItem('cloudinary_upload_preset') || 'mgzcloud1');
      useEffect(() => localStorage.setItem('cloudinary_upload_preset', cloudinaryUploadPreset), [cloudinaryUploadPreset]);

      const [ntfyTopic, setNtfyTopic] = useState(() => localStorage.getItem('ntfy_topic') || 'ldholdingnotif');
      useEffect(() => localStorage.setItem('ntfy_topic', ntfyTopic), [ntfyTopic]);

      // --- Raccourcis clavier `/` et `Échap` (NOUVEAU) ---
      useEffect(() => {
        const handler = (e) => {
          const inField = ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName);
          if (e.key === '/' && !inField) {
            e.preventDefault();
            const input = document.querySelector('[data-search-input]');
            if (input) input.focus();
          }
          if (e.key === 'Escape') {
            setModals(prev => ({ ...prev, brand: false, product: false, brandSelect: false, productDetail: false, cart: false }));
            setShowPinModal(false);
            setShowManageAdmins(false);
            setMobileNavOpen(false);
            setInlinePriceEdit(null);
            // Nettoyage spécifique pour les confirmations destructrices
            if (confirmDeleteBrandId) setConfirmDeleteBrandId(null);
            if (confirmDeleteProduct) setConfirmDeleteProduct(null);
            if (confirmCancelOrderId) setConfirmCancelOrderId(null);
          }
        };
        window.addEventListener('keydown', handler);
        return () => window.removeEventListener('keydown', handler);
      }, [confirmDeleteBrandId, confirmDeleteProduct, confirmCancelOrderId]);

      // ===== Journal d'activité (NOUVEAU) =====
      const logActivity = async (action, details = '') => {
        try {
          const ref = firebase.database().ref('activity');
          await ref.push({ action, details, timestamp: Date.now(), date: new Date().toISOString() });
          // Nettoyage : ne garde que les 100 plus récentes
          const snap = await ref.orderByChild('timestamp').once('value');
          const data = snap.val() || {};
          const keys = Object.keys(data);
          if (keys.length > 100) {
            const sorted = keys.sort((a, b) => (data[a].timestamp || 0) - (data[b].timestamp || 0));
            const toRemove = sorted.slice(0, keys.length - 100);
            const updates = {};
            toRemove.forEach(k => { updates[k] = null; });
            await ref.update(updates);
          }
        } catch (err) { console.error('logActivity:', err); }
      };

      // ===== Helpers existants (inchangés) =====
      const getOrderTimestamp = (order) => {
        if (!order) return null;
        if (typeof order.timestamp === 'number' && order.timestamp > 0) return new Date(order.timestamp);
        if (!order.date) return null;
        let s = String(order.date).replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g, '').replace(/\u00a0/g, ' ');
        if (/^\d{4}-\d{2}-\d{2}/.test(s.trim())) {
          const d = new Date(s);
          if (!isNaN(d.getTime())) return d;
        }
        s = s.replace(/م/g, 'PM').replace(/ص/g, 'AM');
        const dateMatch = s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
        if (!dateMatch) {
          const d = new Date(s);
          return isNaN(d.getTime()) ? null : d;
        }
        const na = parseInt(dateMatch[1], 10);
        const nb = parseInt(dateMatch[2], 10);
        const year = parseInt(dateMatch[3], 10);
        let day, month;
        if (na > 12 && nb <= 12) { day = na; month = nb; }
        else if (nb > 12 && na <= 12) { day = nb; month = na; }
        else { day = na; month = nb; }
        const timeMatch = s.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
        let hour = 0, minute = 0, second = 0;
        if (timeMatch) {
          hour = parseInt(timeMatch[1], 10);
          minute = parseInt(timeMatch[2], 10);
          second = parseInt(timeMatch[3] || '0', 10);
        }
        const upper = s.toUpperCase();
        if (/PM/.test(upper) && hour < 12) hour += 12;
        if (/AM/.test(upper) && hour === 12) hour = 0;

            throw new Error('Configuration Cloudinary incomplète (cloud name ou upload preset)');
          }
          const formData = new FormData();
          formData.append('file', dataUrl);
          formData.append('upload_preset', cloudinaryUploadPreset);
          const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudinaryCloudName}/image/upload`, { method: 'POST', body: formData });
          const json = await response.json();
          if (!response.ok || json.error) throw new Error(json.error?.message || 'Erreur upload Cloudinary');
          return json.secure_url;
        } else {
          if (!imgbbApiKey) throw new Error('Clé API imgbb manquante');
          let base64 = dataUrl;
          if (dataUrl.startsWith('data:')) base64 = dataUrl.split(',')[1];
          const formData = new FormData();
          formData.append('key', imgbbApiKey);
          formData.append('image', base64);
          const response = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });

        const file = e.target.files[0];
        if (!file) return;
        try {
          const dataUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (event) => {
              const img = new Image();
              img.onload = () => {
                const maxWidth = 200;
                const canvas = document.createElement("canvas");
                let width = img.width, height = img.height;
                if (width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL("image/png"));
              };
              img.onerror = () => reject(new Error("Erreur chargement image"));
              img.src = event.target.result;
            };
            reader.onerror = () => reject(new Error("Erreur lecture fichier"));
            reader.readAsDataURL(file);
          });
          setLogoUrl(dataUrl);
          showToast('Logo mis à jour localement.', 'success');
          let finalUrl = dataUrl;
          const hasUploadConfig = imageProvider === 'cloudinary'

        XLSX.utils.book_append_sheet(wb, ws, "Produits");
        const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        const blob = new Blob([wbout], { type: 'application/octet-stream' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `export_produits_${new Date().toISOString().slice(0,10)}.xlsx`;

      };

      const handleImport = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!selectedBrandForData) { showToast("Sélectionnez une marque.", "error"); return; }
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);
            const requiredColumns = ['Nom', 'Prix', 'Pack'];
            const headers = Object.keys(jsonData[0] || {});
            if (!requiredColumns.every(col => headers.includes(col))) {
              showToast("Colonnes requises : Nom, Prix, Pack.", "error");
              return;
            }
            const newProducts = jsonData.map(row => ({
              id: Date.now() + Math.random(),
              name: String(row.Nom || '').trim(),
              price: Number(row.Prix) || 0,
              qty: Number(row.Pack) || 0,
              image: null, hidden: false
            })).filter(p => p.name !== '');
            if (newProducts.length === 0) { showToast("Aucun produit valide.", "error"); return; }
            const brand = brands.find(b => b.id === selectedBrandForData);
            if (brand) {
              await firebase.database().ref('brands').child(selectedBrandForData).update({ products: newProducts });
              await logActivity('Import Excel', `${newProducts.length} produits dans ${brand.name}`);
              showToast(`${newProducts.length} produits importés.`, "success");
            }
          } catch (err) { showToast("Erreur lecture fichier.", "error"); }
        };
        reader.readAsArrayBuffer(file);
        e.target.value = '';
      };

      const handleAddImages = async (e) => {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        if (!selectedBrandForData) { showToast("Sélectionnez une marque.", "error"); return; }
        const brand = brands.find(b => b.id === selectedBrandForData);
        if (!brand) return;
        let updatedProducts = [...(brand.products || [])];
        let count = 0;
        const normalize = (str) => str.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
        const productMap = {};
        updatedProducts.forEach((p, idx) => { const key = normalize(p.name); if (key) productMap[key] = idx; });
        const processImage = (file) => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement("canvas");
              const size = 300;
              canvas.width = canvas.height = size;
              const ctx = canvas.getContext("2d");
              const ratio = Math.max(size / img.width, size / img.height);
              const w = img.width * ratio, h = img.height * ratio;
              ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
              resolve(canvas.toDataURL("image/jpeg", 0.9));
            };
            img.onerror = () => reject(new Error("Erreur image"));
            img.src = event.target.result;
          };
          reader.onerror = () => reject(new Error("Erreur fichier"));
          reader.readAsDataURL(file);
        });
        for (const file of files) {
          const nameWithoutExt = file.name.replace(/\.[^.]+$/, '').trim();
          const normalizedFileName = normalize(nameWithoutExt);
          const productIndex = productMap[normalizedFileName];
          if (productIndex !== undefined) {
            try {
              const dataUrl = await processImage(file);
              const finalUrl = await uploadToImgbb(dataUrl);
              updatedProducts[productIndex] = { ...updatedProducts[productIndex], image: finalUrl };
              count++;
            } catch (err) { showToast(`Erreur ${file.name}: ${err.message}`, 'error'); }
          }
        }
        if (count > 0) {
          try {
            await firebase.database().ref('brands').child(selectedBrandForData).update({ products: updatedProducts });
            await logActivity('Images en lot', `${count} image(s) dans ${brand.name}`);
            showToast(`${count} image(s) associée(s).`, "success");
          } catch (err) { showToast('Erreur mise à jour.', 'error'); }
        } else {
          showToast("Aucune image associée.", "error");
        }
        e.target.value = '';
      };

      // ===== Statistiques existantes =====
      const computeWeeklyStats = (periodWeeks) => {
        const now = new Date();
        now.setHours(23, 59, 59, 999);
        let nWeeks = periodWeeks;
        if (nWeeks === 0) {
          const timestamps = orders.map(getOrderTimestamp).filter(Boolean);
          if (timestamps.length === 0) nWeeks = 4;
          else {
            const oldest = Math.min(...timestamps.map(t => t.getTime()));
            const diffMs = now.getTime() - oldest;
            nWeeks = Math.min(Math.ceil(diffMs / (7 * 24 * 60 * 60 * 1000)) + 1, 52);
          }
        }
        const buckets = [];
        for (let i = nWeeks - 1; i >= 0; i--) {
          const end = new Date(now);
          end.setDate(end.getDate() - i * 7);
          end.setHours(23, 59, 59, 999);
          const start = new Date(end);
          start.setDate(start.getDate() - 6);
          start.setHours(0, 0, 0, 0);
          buckets.push({ start, end, count: 0, revenue: 0, label: `${String(start.getDate()).padStart(2, '0')}/${String(start.getMonth() + 1).padStart(2, '0')}` });
        }
        orders.forEach(order => {
          const ts = getOrderTimestamp(order);
          if (!ts) return;
          for (const b of buckets) {
            if (ts >= b.start && ts <= b.end) { b.count++; b.revenue += Number(order.total) || 0; break; }
          }
        });
        return buckets;
      };

      const computeClientStats = () => {
        const map = {};
        orders.forEach(order => {
          const client = order.client || {};
          const phone = (client.telephone || '').trim().replace(/\s/g, '');
          const name = (client.nom || '').trim() || 'Anonyme';
          const key = phone ? 'p:' + phone : 'n:' + name.toLowerCase();
          if (!map[key]) map[key] = { key, name, phone, count: 0, total: 0 };
          map[key].count++;
          map[key].total += Number(order.total) || 0;
          map[key].name = name;
          if (phone) map[key].phone = phone;
        });
        return Object.values(map).sort((a, b) => b.count - a.count || b.total - a.total);
      };

      // ===== NOUVEAUX helpers dashboard =====
      // Comparaison semaine courante vs précédente (7 jours glissants)
      const getPeriodComparison = () => {
        const now = new Date(); now.setHours(23, 59, 59, 999);
        const startThisWeek = new Date(now); startThisWeek.setDate(now.getDate() - 6); startThisWeek.setHours(0, 0, 0, 0);
        const startLastWeek = new Date(startThisWeek); startLastWeek.setDate(startLastWeek.getDate() - 7);
        const thisWeek = orders.filter(o => { const ts = getOrderTimestamp(o); return ts && ts >= startThisWeek && ts <= now; });
        const lastWeek = orders.filter(o => { const ts = getOrderTimestamp(o); return ts && ts >= startLastWeek && ts < startThisWeek; });
        const thisCount = thisWeek.length;
        const lastCount = lastWeek.length;
        const thisRev = thisWeek.reduce((s, o) => s + (Number(o.total) || 0), 0);
        const lastRev = lastWeek.reduce((s, o) => s + (Number(o.total) || 0), 0);
        const pct = (cur, prev) => prev === 0 ? (cur > 0 ? 100 : 0) : ((cur - prev) / prev) * 100;
        return { thisCount, lastCount, thisRev, lastRev, countChange: pct(thisCount, lastCount), revChange: pct(thisRev, lastRev) };
      };

      // Commandes du jour (depuis minuit)
      const getTodayOrders = () => {
        const today = new Date(); today.setHours(0, 0, 0, 0);
        return orders.filter(o => { const ts = getOrderTimestamp(o); return ts && ts >= today; });
      };

      // Panier moyen sur la liste passée (défaut : toutes les commandes)
      const getAverageBasket = (list) => {
        const l = list || orders;
        if (!l.length) return 0;
        return l.reduce((s, o) => s + (Number(o.total) || 0), 0) / l.length;
      };

      // Taux de livraison
      const getDeliveryRate = () => {
        if (!orders.length) return 0;

      };

      // Mini-graphique 7 derniers jours
      const getLast7DaysChart = () => {
        const now = new Date(); now.setHours(23, 59, 59, 999);
        const dayNames = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
        const buckets = [];
        for (let i = 6; i >= 0; i--) {
          const end = new Date(now); end.setDate(end.getDate() - i); end.setHours(23, 59, 59, 999);
          const start = new Date(end); start.setHours(0, 0, 0, 0);
          buckets.push({ start, end, count: 0, revenue: 0, label: dayNames[start.getDay()], dayNum: start.getDate() });
        }
        orders.forEach(o => {
          const ts = getOrderTimestamp(o);
          if (!ts) return;
          for (const b of buckets) {
            if (ts >= b.start && ts <= b.end) { b.count++; b.revenue += Number(o.total) || 0; break; }
          }
        });
        return buckets;
      };

      // Alertes du dashboard
      const computeAlerts = () => {
        const now = Date.now();
        const dayMs = 24 * 60 * 60 * 1000;
        const oldOrders = orders.filter(o => {
          if (o.status !== 'received') return false;
          const ts = getOrderTimestamp(o);
          return ts && (now - ts.getTime()) > dayMs;
        });
        const productsNoImage = [];
        const productsZero = [];
        const hiddenProducts = [];
        brands.forEach(b => {
          (b.products || []).forEach(p => {
            if (!p.image) productsNoImage.push({ brandId: b.id, brandName: b.name, productId: p.id, productName: p.name });
            if (!Number(p.price) || !Number(p.qty)) productsZero.push({ brandId: b.id, brandName: b.name, productId: p.id, productName: p.name });
            if (p.hidden) hiddenProducts.push({ brandId: b.id, brandName: b.name, productId: p.id, productName: p.name });
          });
        });
        const emptyBrands = brands.filter(b => !(b.products || []).length);
        return { oldOrders, productsNoImage, productsZero, hiddenProducts, emptyBrands };
      };

      // ===== NOUVEAUX helpers commandes =====
      const getOrderAge = (order) => {
        const ts = getOrderTimestamp(order);
        if (!ts) return { text: '—', hours: 0 };
        const diff = Date.now() - ts.getTime();
        const hours = diff / (1000 * 60 * 60);
        const days = Math.floor(hours / 24);
        let text;
        if (hours < 1) text = 'à l\'instant';
        else if (hours < 24) text = `il y a ${Math.floor(hours)} h`;
        else if (days < 7) text = `il y a ${days} j`;
        else text = `il y a ${Math.floor(days / 7)} sem.`;
        return { text, hours };
      };

      const getOrderUrgencyClass = (order) => {
        if (order.status !== 'received') return '';
        const { hours } = getOrderAge(order);
        if (hours > 72) return 'border-l-4 border-rose-500';
        if (hours > 24) return 'border-l-4 border-amber-500';
        return '';
      };

      const filterOrdersByPeriod = (list, period) => {
        if (period === 'all') return list;
        const now = new Date(); now.setHours(23, 59, 59, 999);
        let start;
        if (period === 'today') { start = new Date(); start.setHours(0, 0, 0, 0); }
        else if (period === '7d') { start = new Date(); start.setDate(start.getDate() - 7); start.setHours(0, 0, 0, 0); }
        else if (period === '30d') { start = new Date(); start.setDate(start.getDate() - 30); start.setHours(0, 0, 0, 0); }
        else return list;
        return list.filter(o => { const ts = getOrderTimestamp(o); return ts && ts >= start && ts <= now; });
      };

      const filterOrdersBySearch = (list, search) => {
        const s = (search || '').trim().toLowerCase();
        if (!s) return list;
        return list.filter(o => {
          const c = o.client || {};
          if ((c.nom || '').toLowerCase().includes(s)) return true;
          if ((c.telephone || '').toLowerCase().includes(s)) return true;
          if ((c.adresse || '').toLowerCase().includes(s)) return true;
          if ((o.items || []).some(i => (i.name || '').toLowerCase().includes(s))) return true;
          return false;
        });
      };

      const sortOrdersList = (list, sortKey) => {
        const arr = [...list];
        const ts = o => { const d = getOrderTimestamp(o); return d ? d.getTime() : 0; };
        switch (sortKey) {
          case 'date_desc': return arr.sort((a, b) => ts(b) - ts(a));
          case 'date_asc': return arr.sort((a, b) => ts(a) - ts(b));
          case 'amount_desc': return arr.sort((a, b) => (Number(b.total) || 0) - (Number(a.total) || 0));
          case 'amount_asc': return arr.sort((a, b) => (Number(a.total) || 0) - (Number(b.total) || 0));
          case 'client_asc': return arr.sort((a, b) => ((a.client?.nom || '')).localeCompare(b.client?.nom || ''));
          default: return arr;
        }
      };

      const copyOrderSummary = (order) => {
        const c = order.client || {};

        if (c.adresse) lines.push(`📍 ${c.adresse}`);
        lines.push('');
        lines.push('📦 Articles :');

          lines.push(`• ${i.name} × ${i.quantity} (pack ${i.packQty})`);

        lines.push('');

      const printDeliveryReceipt = (order) => {

        const w = window.open('', '_blank', 'width=800,height=900');

      // Actions groupées commandes
      const bulkProcessOrders = async () => {
        if (!selectedOrders.length) return;

          const updates = {};
          selectedOrders.forEach(id => { updates[`${id}/status`] = 'processing'; });
          await firebase.database().ref('orders').update(updates);

        try {
          const updates = {};
          selectedOrders.forEach(id => { updates[id] = null; });
          await firebase.database().ref('orders').update(updates);
          await logActivity('Annulation groupée', `${selectedOrders.length} commande(s)`);
          showToast(`${selectedOrders.length} commande(s) annulée(s).`, 'info');
          setSelectedOrders([]);
        } catch (err) { showToast('Erreur annulation groupée.', 'error'); }

      // ===== NOUVEAUX helpers produits =====
      const filterProductsGlobal = (list) => {
        let flat = [];
        list.forEach(b => {
          (b.products || []).forEach(p => flat.push({ ...p, brandId: b.id, brandName: b.name }));
        });
        if (productsQuickFilter === 'no_image') flat = flat.filter(p => !p.image);
        else if (productsQuickFilter === 'hidden') flat = flat.filter(p => p.hidden);
        else if (productsQuickFilter === 'missing_price') flat = flat.filter(p => !Number(p.price) || !Number(p.qty));
        const s = (productsGlobalSearch || '').trim().toLowerCase();
        if (s) flat = flat.filter(p => (p.name || '').toLowerCase().includes(s) || (p.brandName || '').toLowerCase().includes(s));
        switch (productsSort) {
          case 'name_asc': flat.sort((a, b) => (a.name || '').localeCompare(b.name || '')); break;
          case 'name_desc': flat.sort((a, b) => (b.name || '').localeCompare(a.name || '')); break;
          case 'price_asc': flat.sort((a, b) => (Number(a.price) || 0) - (Number(b.price) || 0)); break;
          case 'price_desc': flat.sort((a, b) => (Number(b.price) || 0) - (Number(a.price) || 0)); break;
          case 'pack_asc': flat.sort((a, b) => (Number(a.qty) || 0) - (Number(b.qty) || 0)); break;
          case 'pack_desc': flat.sort((a, b) => (Number(b.qty) || 0) - (Number(a.qty) || 0)); break;

      const duplicateProduct = async (brandId, product) => {
        const brand = brands.find(b => b.id === brandId);
        if (!brand) return;
        try {
          const copy = { ...product, id: Date.now(), name: product.name + ' (copie)' };
          const updatedProducts = [...(brand.products || []), copy];
          await firebase.database().ref('brands').child(brandId).update({ products: updatedProducts });
          await logActivity('Produit dupliqué', `${product.name} → ${copy.name}`);
          showToast('Produit dupliqué.', 'success');
        } catch (err) { showToast('Erreur duplication.', 'error'); }
      };

      const saveInlinePrice = async () => {
        if (!inlinePriceEdit) return;
        const { brandId, productId, value } = inlinePriceEdit;
        const newPrice = Number(value);
        if (isNaN(newPrice) || newPrice < 0) { showToast('Prix invalide.', 'error'); return; }
        const brand = brands.find(b => b.id === brandId);
        if (!brand) return;
        try {
          setInlinePriceSaving(true);
          const updatedProducts = brand.products.map(p => p.id === productId ? { ...p, price: newPrice } : p);
          await firebase.database().ref('brands').child(brandId).update({ products: updatedProducts });
          setInlinePriceEdit(null);
          showToast('Prix mis à jour.', 'success');
        } catch (err) { showToast('Erreur.', 'error'); }
        finally { setInlinePriceSaving(false); }
      };

      const bulkProductsAction = async (action) => {
        if (!selectedProducts.length) return;
        if (action === 'delete' && !confirm(`Supprimer ${selectedProducts.length} produit(s) ?`)) return;
        try {
          // Regroupe par brandId
          const byBrand = {};
          selectedProducts.forEach(key => {
            const [brandId, productId] = key.split('::');
            if (!byBrand[brandId]) byBrand[brandId] = new Set();
            byBrand[brandId].add(Number(productId));
          });
          for (const brandId of Object.keys(byBrand)) {
            const brand = brands.find(b => b.id === brandId);
            if (!brand) continue;
            let updatedProducts = brand.products || [];
            if (action === 'hide') {
              updatedProducts = updatedProducts.map(p => byBrand[brandId].has(p.id) ? { ...p, hidden: true } : p);
            } else if (action === 'show') {
              updatedProducts = updatedProducts.map(p => byBrand[brandId].has(p.id) ? { ...p, hidden: false } : p);
            } else if (action === 'delete') {
              updatedProducts = updatedProducts.filter(p => !byBrand[brandId].has(p.id));
            }
            await firebase.database().ref('brands').child(brandId).update({ products: updatedProducts });
          }
          const actionLabel = { hide: 'masqué(s)', show: 'affiché(s)', delete: 'supprimé(s)' }[action];
          await logActivity('Action groupée produits', `${selectedProducts.length} ${actionLabel}`);
          showToast(`${selectedProducts.length} produit(s) ${actionLabel}.`, 'success');
          setSelectedProducts([]);
        } catch (err) { showToast('Erreur action groupée.', 'error'); }
      };

      // ===== NOUVEAUX helpers stats =====
      const getTopProducts = () => {
        const map = {};
        orders.forEach(o => {
          (o.items || []).forEach(i => {
            const key = `${i.brandId}::${i.productId}`;
            if (!map[key]) map[key] = { key, name: i.name || '—', brandName: (brands.find(b => b.id === i.brandId) || {}).name || '—', quantity: 0, revenue: 0, orderCount: 0 };
            map[key].quantity += i.quantity || 0;
            map[key].revenue += (i.quantity || 0) * (i.price || 0) * (i.packQty || 0);
            map[key].orderCount++;
          });
        });
        return Object.values(map).sort((a, b) => b.quantity - a.quantity);
      };

      const getRevenueByBrand = () => {
        const map = {};
        orders.forEach(o => {
          (o.items || []).forEach(i => {
            if (!map[i.brandId]) map[i.brandId] = { id: i.brandId, name: (brands.find(b => b.id === i.brandId) || {}).name || '—', revenue: 0, orderCount: 0 };
            map[i.brandId].revenue += (i.quantity || 0) * (i.price || 0) * (i.packQty || 0);
            map[i.brandId].orderCount++;
          });
        });
        return Object.values(map).sort((a, b) => b.revenue - a.revenue);
      };

      const getNewVsReturningClients = () => {
        const directory = buildClientsDirectory();
        let newCount = 0;
        let returning = 0;
        const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
        directory.forEach(c => {
          const firstTs = c.orders.reduce((min, o) => {
            const ts = getOrderTimestamp(o);
            return ts && ts.getTime() < min ? ts.getTime() : min;
          }, Infinity);
          if (firstTs >= cutoff) newCount++;
          else returning++;
        });
        return { newCount, returning };
      };

      const exportStatsToExcel = () => {
        const weekly = computeWeeklyStats(statsPeriod);
        const clients = computeClientStats();
        const topProducts = getTopProducts();
        const revByBrand = getRevenueByBrand();
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
          weekly.map(w => ({ 'Semaine': w.label, 'Commandes': w.count, 'Revenu': w.revenue }))
        ), "Hebdomadaire");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
          clients.map(c => ({ 'Client': c.name, 'Téléphone': c.phone || '', 'Commandes': c.count, 'Total': c.total }))
        ), "Clients");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
          topProducts.map(p => ({ 'Produit': p.name, 'Marque': p.brandName, 'Commandes': p.orderCount, 'Quantité': p.quantity, 'Revenu': p.revenue }))
        ), "Top produits");
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
          revByBrand.map(b => ({ 'Marque': b.name, 'Commandes': b.orderCount, 'Revenu': b.revenue }))
        ), "Revenu par marque");
        const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        const blob = new Blob([wbout], { type: 'application/octet-stream' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `statistiques_${new Date().toISOString().slice(0, 10)}.xlsx`;
        link.click();
        URL.revokeObjectURL(link.href);
        showToast("Statistiques exportées.", "success");
      };

      // ===== NOUVEAUX helpers clients =====
      const buildClientsDirectory = () => {
        const map = {};
        orders.forEach(order => {
          const c = order.client || {};
          const phone = (c.telephone || '').trim().replace(/\s/g, '');
          const name = (c.nom || '').trim() || 'Anonyme';
          const key = phone ? 'p:' + phone : 'n:' + name.toLowerCase();
          if (!map[key]) map[key] = { key, name, phone, orders: [], count: 0, total: 0, lastOrder: null, addresses: new Set() };
          map[key].orders.push(order);
          map[key].count++;
          map[key].total += Number(order.total) || 0;
          if (c.adresse) map[key].addresses.add(c.adresse);
          const ts = getOrderTimestamp(order);
          const lastTs = map[key].lastOrder ? getOrderTimestamp(map[key].lastOrder) : null;
          if (!map[key].lastOrder || (ts && (!lastTs || ts > lastTs))) map[key].lastOrder = order;
          if (name !== 'Anonyme') map[key].name = name;
          if (phone) map[key].phone = phone;
        });
        return Object.values(map).map(c => ({ ...c, addresses: [...c.addresses] }))
          .sort((a, b) => (getOrderTimestamp(b.lastOrder)?.getTime() || 0) - (getOrderTimestamp(a.lastOrder)?.getTime() || 0));
      };

      // ===== NOUVEAUX : Sauvegarde JSON =====
      const exportBackupJSON = async () => {
        try {
          const [brandsSnap, ordersSnap, settingsSnap] = await Promise.all([
            firebase.database().ref('brands').once('value'),
            firebase.database().ref('orders').once('value'),
            firebase.database().ref('settings').once('value')
          ]);
          const data = {
            version: 1,
            exportedAt: new Date().toISOString(),
            brands: brandsSnap.val() || {},
            orders: ordersSnap.val() || {},
            settings: settingsSnap.val() || {}
          };
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `backup_ldholding_${new Date().toISOString().slice(0, 10)}.json`;
          link.click();
          URL.revokeObjectURL(link.href);
          await logActivity('Sauvegarde exportée');
          showToast("Sauvegarde exportée.", "success");
        } catch (err) {
          console.error(err);
          showToast('Erreur export: ' + err.message, 'error');
        }
      };

      const handleBackupImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = JSON.parse(evt.target.result);
            if (!data || typeof data !== 'object') throw new Error('Fichier invalide.');
            if (!data.brands && !data.orders && !data.settings) throw new Error('Aucune donnée reconnue.');
            setPendingBackupData(data);
            setShowBackupImportConfirm(true);
          } catch (err) {
            showToast('Fichier invalide: ' + err.message, 'error');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const confirmBackupImport = async () => {
        if (!pendingBackupData) return;
        try {
          if (pendingBackupData.brands) await firebase.database().ref('brands').set(pendingBackupData.brands);
          if (pendingBackupData.orders) await firebase.database().ref('orders').set(pendingBackupData.orders);
          if (pendingBackupData.settings) await firebase.database().ref('settings').update(pendingBackupData.settings);
          const brandCount = Object.keys(pendingBackupData.brands || {}).length;
          const orderCount = Object.keys(pendingBackupData.orders || {}).length;
          await logActivity('Import de sauvegarde', `${brandCount} marques, ${orderCount} commandes`);
          showToast('Sauvegarde importée avec succès.', 'success');
          setPendingBackupData(null);
          setShowBackupImportConfirm(false);
        } catch (err) {
          console.error(err);
          showToast('Erreur import: ' + err.message, 'error');
        }
      };

      // ===== KPI globaux =====
      const totalRevenue = orders.reduce((s, o) => s + (Number(o.total) || 0), 0);
      const totalProducts = brands.reduce((s, b) => s + (b.products || []).length, 0);

      const renderCartDrawer = () => React.createElement(React.Fragment, null,
