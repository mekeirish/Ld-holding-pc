    const ImageUpload = ({ onUpload, currentImage }) => {
      const handleChange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = event => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const size = 300;
            canvas.width = canvas.height = size;
            const ctx = canvas.getContext("2d");
            const ratio = Math.max(size / img.width, size / img.height);
            const w = img.width * ratio, h = img.height * ratio;
            ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
            onUpload(canvas.toDataURL("image/jpeg", 0.9));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      };

        currentImage && React.createElement("div", { className: "w-16 h-16 rounded-lg overflow-hidden bg-[#0E1B2D] border border-[#3A4A5F] flex-shrink-0" },

    const Toast = ({ message, type, onClose }) => {

    const hashPin = async (pin) => {
      const encoder = new TextEncoder();
      const data = encoder.encode(pin);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    };

    const App = () => {

      const [logoUrl, setLogoUrl] = useState(() => localStorage.getItem('app_logo') || null);

      const fileInputRef = useRef(null);
      const imageInputRef = useRef(null);
      const logoInputRef = useRef(null);
      const longPressTimerRef = useRef(null);
      const longPressTriggeredRef = useRef(false);

      useEffect(() => {
        try {
          const settingsRef = firebase.database().ref('settings');

            const data = snapshot.val();
            if (data) {
              if (data.logo) setLogoUrl(data.logo);

          });
          return () => settingsRef.off('value', settingsListener);
        } catch (err) {
          console.error('Erreur listener settings:', err);
          setLoading(false);
        }

      useEffect(() => {

          const brandsListener = brandsRef.on('value', (snapshot) => {

                  ...order, id: key,

      const [modals, setModals] = useState({

      const [imgbbApiKey, setImgbbApiKey] = useState(() => localStorage.getItem('imgbb_api_key') || '');

      const [cloudinaryCloudName, setCloudinaryCloudName] = useState(() => localStorage.getItem('cloudinary_cloud_name') || 'h91be5lz');
      useEffect(() => localStorage.setItem('cloudinary_cloud_name', cloudinaryCloudName), [cloudinaryCloudName]);

      const [cloudinaryUploadPreset, setCloudinaryUploadPreset] = useState(() => localStorage.getItem('cloudinary_upload_preset') || 'mgzcloud1');
      useEffect(() => localStorage.setItem('cloudinary_upload_preset', cloudinaryUploadPreset), [cloudinaryUploadPreset]);

      const [ntfyTopic, setNtfyTopic] = useState(() => localStorage.getItem('ntfy_topic') || 'ldholdingnotif');
      useEffect(() => localStorage.setItem('ntfy_topic', ntfyTopic), [ntfyTopic]);

      const getOrderTimestamp = (order) => {
        if (!order) return null;
        if (typeof order.timestamp === 'number' && order.timestamp > 0) return new Date(order.timestamp);
        if (!order.date) return null;
        let s = String(order.date).replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g, '').replace(/\u00a0/g, ' ');
        if (/^\d{4}-\d{2}-\d{2}/.test(s.trim())) {
          const d = new Date(s);
          if (!isNaN(d.getTime())) return d;
        }
        s = s.replace(/م/g, 'PM').replace(/ص/g, 'AM');
        const dateMatch = s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
        if (!dateMatch) {
          const d = new Date(s);
          return isNaN(d.getTime()) ? null : d;
        }
        const na = parseInt(dateMatch[1], 10);
        const nb = parseInt(dateMatch[2], 10);
        const year = parseInt(dateMatch[3], 10);
        let day, month;
        if (na > 12 && nb <= 12) { day = na; month = nb; }
        else if (nb > 12 && na <= 12) { day = nb; month = na; }
        else { day = na; month = nb; }
        const timeMatch = s.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
        let hour = 0, minute = 0, second = 0;
        if (timeMatch) {
          hour = parseInt(timeMatch[1], 10);
          minute = parseInt(timeMatch[2], 10);
          second = parseInt(timeMatch[3] || '0', 10);
        }
        const upper = s.toUpperCase();
        if (/PM/.test(upper) && hour < 12) hour += 12;
        if (/AM/.test(upper) && hour === 12) hour = 0;
        if (month < 1 || month > 12 || day < 1 || day > 31) return null;
        const d = new Date(year, month - 1, day, hour, minute, second);
        return isNaN(d.getTime()) ? null : d;
      };

      const formatOrderDate = (order) => {
        const d = getOrderTimestamp(order);
        if (!d) return order && order.date ? order.date : '—';
        const pad = n => String(n).padStart(2, '0');
        return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      };

      const migrateOrderDates = async () => {
        if (!isAdmin) return;
        try {
          const snapshot = await firebase.database().ref('orders').once('value');
          const data = snapshot.val() || {};
          const updates = {};
          Object.keys(data).forEach(id => {
            const o = data[id];
            if (typeof o.timestamp === 'number') return;
            const d = getOrderTimestamp(o);
            if (!d) return;
            updates[`${id}/timestamp`] = d.getTime();
            updates[`${id}/date`] = d.toISOString();
          });
          if (Object.keys(updates).length === 0) { showToast('Aucune commande à migrer.', 'info'); return; }
          await firebase.database().ref('orders').update(updates);
          showToast(`${Object.keys(updates).length / 2} commande(s) migrée(s).`, 'success');
        } catch (err) {
          console.error(err);
          showToast('Erreur migration : ' + err.message, 'error');
        }
      };

      const fetchAdmins = async () => {
        try {
          const snapshot = await firebase.database().ref('admins').once('value');
          const data = snapshot.val();
          if (data && Array.isArray(data)) return data.filter(item => item && typeof item === 'object' && item.name && item.hash);
          return [];
        } catch (err) { console.error('Erreur chargement admins:', err); return []; }
      };

      const addAdminPin = async (pin, name = 'MEKEIRISHDEV') => {
        const hash = await hashPin(pin);
        const current = await fetchAdmins();
        if (current.some(a => a.hash === hash)) throw new Error('Ce code PIN existe déjà.');
        const newList = [...current, { name, hash }];
        await firebase.database().ref('admins').set(newList);
        return { name, hash };
      };

      const removeAdminPin = async (hash) => {
        const current = await fetchAdmins();
        const newList = current.filter(a => a.hash !== hash);
        await firebase.database().ref('admins').set(newList);
      };

      const uploadToImgbb = async (dataUrl) => {
        if (imageProvider === 'cloudinary') {
          if (!cloudinaryCloudName || !cloudinaryUploadPreset) {
            throw new Error('Configuration Cloudinary incomplète (cloud name ou upload preset)');
          }
          const formData = new FormData();
          formData.append('file', dataUrl);
          formData.append('upload_preset', cloudinaryUploadPreset);
          const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudinaryCloudName}/image/upload`, { method: 'POST', body: formData });
          const json = await response.json();
          if (!response.ok || json.error) throw new Error(json.error?.message || 'Erreur upload Cloudinary');
          return json.secure_url;
        } else {
          if (!imgbbApiKey) throw new Error('Clé API imgbb manquante');
          let base64 = dataUrl;
          if (dataUrl.startsWith('data:')) base64 = dataUrl.split(',')[1];
          const formData = new FormData();
          formData.append('key', imgbbApiKey);
          formData.append('image', base64);
          const response = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
          const json = await response.json();
          if (!json.success) throw new Error(json.error?.message || 'Erreur upload imgbb');
          return json.data.url;
        }
      };

      const handleLogoUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const dataUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (event) => {
              const img = new Image();
              img.onload = () => {
                const maxWidth = 200;
                const canvas = document.createElement("canvas");
                let width = img.width, height = img.height;
                if (width > maxWidth) { height = (height * maxWidth) / width; width = maxWidth; }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);

      const handleAddImages = async (e) => {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        if (!selectedBrandForData) { showToast("Sélectionnez une marque.", "error"); return; }
        const brand = brands.find(b => b.id === selectedBrandForData);
        if (!brand) return;
        let updatedProducts = [...(brand.products || [])];
        let count = 0;
        const normalize = (str) => str.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
        const productMap = {};
        updatedProducts.forEach((p, idx) => { const key = normalize(p.name); if (key) productMap[key] = idx; });
        const processImage = (file) => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement("canvas");
              const size = 300;
              canvas.width = canvas.height = size;
              const ctx = canvas.getContext("2d");
              const ratio = Math.max(size / img.width, size / img.height);
              const w = img.width * ratio, h = img.height * ratio;
              ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
              resolve(canvas.toDataURL("image/jpeg", 0.9));
            };
            img.onerror = () => reject(new Error("Erreur image"));
            img.src = event.target.result;
          };
          reader.onerror = () => reject(new Error("Erreur fichier"));
          reader.readAsDataURL(file);
        });
        for (const file of files) {
          const nameWithoutExt = file.name.replace(/\.[^.]+$/, '').trim();
          const normalizedFileName = normalize(nameWithoutExt);
          const productIndex = productMap[normalizedFileName];
          if (productIndex !== undefined) {
            try {
              const dataUrl = await processImage(file);
              const finalUrl = await uploadToImgbb(dataUrl);
              updatedProducts[productIndex] = { ...updatedProducts[productIndex], image: finalUrl };
              count++;
            } catch (err) { showToast(`Erreur ${file.name}: ${err.message}`, 'error'); }
          }
        }
        if (count > 0) {
          try {
            await firebase.database().ref('brands').child(selectedBrandForData).update({ products: updatedProducts });

      const computeWeeklyStats = (periodWeeks) => {
        const now = new Date();
        now.setHours(23, 59, 59, 999);
        let nWeeks = periodWeeks;
        if (nWeeks === 0) {
          const timestamps = orders.map(getOrderTimestamp).filter(Boolean);
          if (timestamps.length === 0) nWeeks = 4;
          else {
            const oldest = Math.min(...timestamps.map(t => t.getTime()));
            const diffMs = now.getTime() - oldest;
            nWeeks = Math.min(Math.ceil(diffMs / (7 * 24 * 60 * 60 * 1000)) + 1, 52);
          }
        }
        const buckets = [];
        for (let i = nWeeks - 1; i >= 0; i--) {
          const end = new Date(now);
          end.setDate(end.getDate() - i * 7);
          end.setHours(23, 59, 59, 999);
          const start = new Date(end);
          start.setDate(start.getDate() - 6);
          start.setHours(0, 0, 0, 0);
          buckets.push({ start, end, count: 0, revenue: 0, label: `${String(start.getDate()).padStart(2, '0')}/${String(start.getMonth() + 1).padStart(2, '0')}` });
        }
        orders.forEach(order => {
